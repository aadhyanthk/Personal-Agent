<!DOCTYPE html>
<html>
<head>
  <title>Personal Operations Agent</title>
  <style>
    body { font-family: sans-serif; width: 300px; padding: 10px; }
    button { padding: 8px 12px; margin-top: 10px; cursor: pointer; }
    #status { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Agent Dashboard</h2>
  <div id="apiKeySection" style="display:none; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; background-color: #f9f9f9;">
    <label><strong>Gemini API Key:</strong></label><br>
    <small><a href="https://aistudio.google.com/app/apikey" target="_blank">Click here to generate a free key</a></small>
    <input type="password" id="apiKeyInput" placeholder="AIzaSy..." style="width: 100%; margin-top: 5px; margin-bottom: 5px; box-sizing: border-box;" />
    <button id="saveKeyBtn">Save Key</button>
  </div>

  <button id="loginBtn">Login with Google</button>
  <div id="dashboardSection" style="display:none;">
    <label for="timeframeSelect"><small>Fetch unread from:</small></label>
    <select id="timeframeSelect" style="margin-bottom: 5px; width: 100%;">
        <option value="1h">Last Hour</option>
        <option value="1d" selected>Last Day</option>
        <option value="7d">Last Week</option>
    </select>
    <button id="checkEmailBtn" style="width: 100%;">Check Emails</button>
    <div id="status" style="margin-top: 5px;">Not logged in.</div>
    <hr>
    <h3>Pending Actions</h3>
    <div id="pendingActions"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
